[pytest]
# Pytest configuration for AWS AgentCore ServiceNow integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.9

# Add current directory to Python path
pythonpath = . src

# Coverage options
addopts =
    # Verbose output
    -v
    # Show summary of all test types (failed, error, skipped, xfailed, xpassed)
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (all markers must be registered)
    --strict-markers
    # Strict config
    --strict-config
    # Coverage options
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    # Warnings
    -W ignore::DeprecationWarning
    # Concise traceback format
    --tb=short

# Markers for organizing tests
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test multiple components together
    servicenow: Tests related to ServiceNow integration
    webhook: Tests related to webhook handling
    agent: Tests related to agent functionality
    slow: Tests that take a long time to run
    requires_aws: Tests that require AWS credentials
    requires_servicenow: Tests that require ServiceNow instance access

# Coverage configuration
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */.venv/*

[coverage:report]
# Regexes for lines to exclude from consideration
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    # Don't complain about TYPE_CHECKING blocks
    if TYPE_CHECKING:
    # Don't complain about ellipsis
    \.\.\.

precision = 2
skip_empty = True
